name: npm-publish
# v* 태그를 push하면 npm에 스테이징 게시해요. 공개 승인은 npmjs.com에서 2FA로 해요.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: install npm for staged publish
        run: npm install -g npm@11.21.1
      - name: check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error title=version mismatch::태그 버전과 package.json 버전을 같게 맞춰 주세요. 태그: $tag_version, package.json: $pkg_version"
            exit 1
          fi
          echo "태그와 package.json 버전이 같아요: $pkg_version"
      - name: check version is new on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$name@$version" version 2> /dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error title=already published::$name@$version 은 이미 npm에 게시되어 있어요. package.json 버전을 올리고 새 태그로 다시 시작해 주세요."
            exit 1
          fi
          echo "$name@$version 은 새 버전이에요. 게시를 이어 갈게요."
      - run: npm ci
      - run: npm run verify
      - name: check npm version
        run: |
          v="$(npm --version)"
          echo "npm $v"
          IFS=. read -r major minor _ <<< "$v"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 15 ]; }; then
            echo "::error title=npm version::스테이징 게시에는 npm 11.15.0 이상이 필요해요. 현재 버전: $v"
            exit 1
          fi
      - name: stage publish
        run: npm stage publish
      - name: summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### npm 스테이징 게시"
            echo ""
            echo "- 패키지: $name@$version"
            echo "- 스테이징을 마쳤어요. npmjs.com 패키지 페이지의 Staged Packages 탭에서 2FA로 승인하면 공개돼요."
            echo "- 터미널에서는 npm stage approve 명령으로 승인할 수 있어요."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "스테이징을 마쳤어요. npmjs.com Staged Packages 탭에서 $name@$version 을 승인해 주세요."
