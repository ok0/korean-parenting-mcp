<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1762" viewBox="0 0 1200 1762" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">실제 질문과 답변으로 만든 한 장 준비 보고서</title>
<desc id="desc">실제 답변 예시 그림. 2026-10-31에 한 AI 앱에 보낸 질문: 출산예정일 2027-03-15, 서울 성동구, 첫째 아이, 남편과 아내 모두 직장인. 근처 휴일 소아 진료 기관과 유치원도 넣어서 한 장짜리 준비 보고서로 정리해 줘. 그 앱에서 받은 실제 답변을 그림에 맞게 한 장으로 줄인 보고서. 사용한 기능: get_timeline, find_benefits, find_night_pediatric, find_kindergarten.</desc>
<rect x="0" y="0" width="1200" height="1762" fill="#FFFFFF"/>
<text x="24" y="96" font-size="15" fill="#1F5FBF" data-max-w="340" letter-spacing="-0.1" font-weight="700"><tspan x="24" y="96">AI 도우미에게 실제로 보낸 질문</tspan></text>
<rect x="24" y="110" width="340" height="152" rx="12" fill="#F3F5F8" stroke="#C9D1DB"/>
<text x="44" y="140" font-size="16" fill="#1A1F26" data-max-w="300" letter-spacing="-0.2"><tspan x="44" y="140">출산예정일 2027-03-15, 서울 성동구,</tspan><tspan x="44" y="164">첫째 아이, 남편과 아내 모두 직장인.</tspan><tspan x="44" y="188">근처 휴일 소아 진료 기관과 유치원도</tspan><tspan x="44" y="212">넣어서 한 장짜리 준비 보고서로 정리해</tspan><tspan x="44" y="236">줘.</tspan></text>
<line x1="372" y1="186" x2="432" y2="186" stroke="#4A5563" stroke-width="2"/>
<polygon points="432,186 424,181 424,191" fill="#4A5563"/>
<g data-source="sha256-57c006f88a3a7601">
<rect x="440" y="51" width="720" height="1660" rx="6" fill="#F3F5F8" stroke="#C9D1DB"/>
<text x="476" y="111" font-size="20" fill="#1A1F26" data-max-w="648" letter-spacing="-0.4" font-weight="700"><tspan x="476" y="111">첫째 출산 준비 보고서 (예정일 2027-03-15 · 서울 성동구)</tspan></text>
<text x="476" y="149" font-size="14" fill="#1F5FBF" data-max-w="648" letter-spacing="-0.1" font-weight="700"><tspan x="476" y="149">실제 답변 예시 · 개인 맞춤 아님 · 비공식 도구</tspan></text>
<text x="476" y="175" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="175">2026-10-31에 한 AI 앱에서 실제로 받은 답변을 그림에 맞게 줄여서 한 장으로 구성했어요.</tspan><tspan x="476" y="194">앱·질문·날짜에 따라 답변이 달라질 수 있어요.</tspan></text>
<line x1="476" y1="227" x2="1124" y2="227" stroke="#C9D1DB" stroke-width="1"/>
<text x="476" y="245" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="245">요약·할 일</tspan></text>
<text x="476" y="267" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="267">출산까지 약 4.5개월(19주) 남았습니다.</tspan></text>
<text x="476" y="287" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="287">• 11월 · 임신부 인플루엔자 접종(무료, 출산 전까지)</tspan></text>
<text x="476" y="307" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="307">• 11~12월 · 두 사람 회사 인사팀에 출산전후휴가·배우자 출산휴가·육아휴직 계획 공유</tspan></text>
<text x="476" y="327" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="327">• 출산 직후 · 출생신고 + 부모급여·아동수당·첫만남이용권을 주민센터에서 한 번에 신청</tspan></text>
<text x="476" y="347" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="347">• 출산 후 · 어린이집 입소대기 등록(아이사랑 포털)</tspan></text>
<text x="476" y="367" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="367">날짜는 모두 예정일(2027-03-15) 기준 추정이며 실제 출생일에 따라 바뀝니다.</tspan></text>
<text x="476" y="390" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="390">출처: 2026-10-31 기준 한국 육아 일정 도우미 · 일정 계산(예정일 2027-03-15, 첫째)</tspan></text>
<text x="476" y="427" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="427">타임라인 핵심</tspan></text>
<text x="476" y="449" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="449">• 2027-01-24 ~ 2027-07-13 · 배우자 출산휴가 20일 사용 가능 구간</tspan></text>
<text x="476" y="469" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="469">• 2027-02-22 ~ 2027-03-15 · 산전검진 매주 1회, 출산전후휴가 시작(아내가 시작일 결정)</tspan></text>
<text x="476" y="489" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="489">• 2027-03-15 · 출산 예정, B형간염 1차</tspan></text>
<text x="476" y="509" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="509">• ~2027-04-14 · 출생신고(1개월, 넘기면 과태료 최대 5만원)</tspan></text>
<text x="476" y="529" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="529">• ~2027-05-13 · 부모급여·아동수당 신청(60일 내 신청해야 출생월부터 소급)</tspan></text>
<text x="476" y="549" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="549">• ~2029-03-14 · 첫만남이용권 신청(첫째 200만원)</tspan></text>
<text x="476" y="569" font-size="14" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="569">• 외 6건 더 있어요</tspan></text>
<text x="476" y="593" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="593">출처: 2026-10-31 근거는 모자보건법 시행규칙 별표 1·근로기준법(2026-10-08</tspan><tspan x="476" y="612">시행)·남녀고용평등법(2026-09-18 시행)·가족관계등록법·2026 국가예방접종 지침·보건복지부</tspan><tspan x="476" y="631">임신·출산 진료비입니다.</tspan></text>
<text x="476" y="668" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="668">맞벌이 휴가·휴직</tspan></text>
<text x="476" y="690" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="690">부부가 각각 육아휴직을 3개월 이상 쓰면 한쪽이 6개월을 더 쓸 수 있어, 두 사람 모두 3개월 이상</tspan><tspan x="476" y="710">쓰는 쪽이 유리합니다.</tspan></text>
<text x="476" y="730" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="730">• 출산전후휴가 · 아내 · 90일, 출산 후 45일 이상, 최초 60일 유급</tspan></text>
<text x="476" y="750" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="750">• 배우자 출산휴가 · 남편 · 유급 20일, 3회까지 분할, 예정일 50일 전~출산 후 120일</tspan></text>
<text x="476" y="770" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="770">• 육아휴직 · 각자 · 1인 1년 이내(만 8세 이하), 부부 각 3개월 이상 사용 시 한쪽 6개월 추가</tspan></text>
<text x="476" y="790" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="790">• 단기 육아휴직 · 각자 · 연 1회 1~2주(2026-09-18 시행)</tspan></text>
<text x="476" y="810" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="810">육아휴직 급여 참고값: 1~3개월 월 최대 250만원, 4~6개월 200만원, 7개월부터 160만원.</tspan></text>
<text x="476" y="833" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="833">출처: 2026-10-31 근로기준법 제74조·남녀고용평등법 제18조의2·제19조와 생활법령정보 육아휴직</tspan><tspan x="476" y="852">급여이며, 법률 해석이 아닌 참고 정보입니다.</tspan></text>
<text x="476" y="889" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="889">지원금·혜택</tspan></text>
<text x="476" y="911" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="911">국가 현금성 지원만 첫해 약 1,520만원(첫만남 200 + 부모급여 1,200 + 아동수당 120)이며,</tspan><tspan x="476" y="931">서울·성동구 산후 지원이 더해집니다.</tspan></text>
<text x="476" y="951" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="951">• 임신·출산 진료비 · 100만원 바우처 · 지금, 건강보험공단·카드사</tspan></text>
<text x="476" y="971" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="971">• 첫만남이용권 · 첫째 200만원 · 출생 후 2년 내, 주민센터·정부24</tspan></text>
<text x="476" y="991" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="991">• 부모급여 · 0세 월 100만원, 1세 월 50만원 · 출생 후 60일 내</tspan></text>
<text x="476" y="1011" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1011">• 아동수당 · 월 10만원(만 9세 미만, 확대 예정) · 출생 후 60일 내</tspan></text>
<text x="476" y="1031" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1031">• 성동구 산후조리비용 · 구 거주 출산가정 지원 · 성동구 건강관리과</tspan></text>
<text x="476" y="1051" font-size="14" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1051">• 외 3건 더 있어요</tspan></text>
<text x="476" y="1075" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1075">출처: 2026-10-31 기준 행정안전부 공공서비스(혜택) 정보(보조금24, 성동구 출산 단계 85건 중 발췌) ·</tspan><tspan x="476" y="1094">담당 기관에서 최종 확인하세요.</tspan></text>
<text x="476" y="1131" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="1131">성동구 휴일 소아 진료</tspan></text>
<text x="476" y="1153" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1153">일요일 저녁까지 여는 곳은 달빛어린이병원인 365다움의원(왕십리역사, 24시까지) 한 곳이고,</tspan><tspan x="476" y="1173">나머지는 대부분 오전 진료입니다.</tspan></text>
<text x="476" y="1193" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1193">• 365다움의원 · 달빛어린이병원 · 09:00~24:00</tspan></text>
<text x="476" y="1213" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1213">• 아이들소아청소년과의원 · 소아청소년과 · 09:30~18:00</tspan></text>
<text x="476" y="1233" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1233">• 연세드림소아청소년과의원 · 소아청소년과 · 09:00~13:00</tspan></text>
<text x="476" y="1253" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1253">• 와이키즈소아청소년과의원 · 소아청소년과 · 08:30~13:00</tspan></text>
<text x="476" y="1273" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1273">응급 상황은 119 또는 응급실을 이용하세요.</tspan></text>
<text x="476" y="1296" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1296">출처: 2026-10-31 조회 · 일요일 운영시간 기준 국립중앙의료원 공공데이터이며 공휴일 운영은 다를 수</tspan><tspan x="476" y="1315">있으니 방문 전 전화로 확인하세요.</tspan></text>
<text x="476" y="1352" font-size="16" fill="#1A1F26" data-max-w="648" letter-spacing="-0.2" font-weight="700"><tspan x="476" y="1352">어린이집·유치원</tspan></text>
<text x="476" y="1374" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1374">맞벌이 복직 시점에 맞춰 출생 직후 어린이집 입소대기부터 걸어 두고, 유치원은 2030년 3월 만3세반</tspan><tspan x="476" y="1394">입학(2027년생 기준)을 목표로 2029년 가을 원서 접수(처음학교로)를 준비하면 됩니다.</tspan></text>
<text x="476" y="1414" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1414">어린이집: 출생신고 후 아이사랑 등록대기 신청에서 성동구 어린이집 여러 곳에 대기를 겁니다.</tspan></text>
<text x="476" y="1434" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1434">유치원 · 설립 · 만3세 정원/현원</tspan></text>
<text x="476" y="1453" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1453">• 옥수삼성유치원 · 사립 · 60 / 23</tspan></text>
<text x="476" y="1473" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1473">• 조은유치원 · 사립 · 30 / 11</tspan></text>
<text x="476" y="1493" font-size="14" fill="#1A1F26" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1493">• 서울동명초 병설유치원 · 공립 · 14 / 2</tspan></text>
<text x="476" y="1513" font-size="14" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1513">• 외 3건 더 있어요</tspan></text>
<text x="476" y="1537" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1537">출처: 2026-10-31 기준 유치원알리미 2026년 2차 공시(성동구 28곳 중 6곳)와 아이사랑 등록대기</tspan><tspan x="476" y="1556">안내이며 입학 시점엔 달라집니다.</tspan></text>
<line x1="476" y1="1597" x2="1124" y2="1597" stroke="#C9D1DB" stroke-width="1"/>
<text x="476" y="1611" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1611">사용한 기능: 출산·육아 일정 계산, 임신·육아 지원금 찾기, 밤·휴일 소아 진료 찾기, 유치원 자리 알아보기</tspan><tspan x="476" y="1630">· 뒤의 세 가지는 키가 필요한 기능이에요</tspan></text>
<text x="476" y="1649" font-size="13" fill="#4A5563" data-max-w="648" letter-spacing="-0.1"><tspan x="476" y="1649">의료·법률 판단이 아닌 일반 안내예요. 응급 상황은 119 또는 응급실, 금액·자격·기한은 담당 기관에서 최종</tspan><tspan x="476" y="1668">확인하세요.</tspan></text>
</g>
</svg>
