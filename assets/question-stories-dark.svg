<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">질문 따라가기 예시 3가지</title>
<desc id="desc">예시 질문 3개가 도구와 출처를 거쳐 답이 되는 과정입니다. 도구: find_night_pediatric, get_timeline, check_recall</desc>
<rect x="0" y="0" width="1200" height="580" fill="#0F141A"/>
<text x="30" y="44" font-size="22" fill="#E8EDF2" data-max-w="1140" letter-spacing="-0.4" font-weight="700"><tspan x="30" y="44">이렇게 물으면 이렇게 찾아요 · 예시 3가지</tspan></text>
<text x="30" y="70" font-size="13" fill="#A9B4C0" data-max-w="1140" letter-spacing="-0.1"><tspan x="30" y="70">질문 예시가 도구와 출처를 거쳐 답이 되는 길을 따라가 봐요. 답은 모두 예시예요.</tspan></text>
<text x="116" y="104" font-size="13" fill="#A9B4C0" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="116" y="104">질문</tspan></text>
<text x="390" y="104" font-size="13" fill="#A9B4C0" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="390" y="104">도구</tspan></text>
<text x="664" y="104" font-size="13" fill="#A9B4C0" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="664" y="104">출처</tspan></text>
<text x="938" y="104" font-size="13" fill="#A9B4C0" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="938" y="104">답 (예시)</tspan></text>
<g data-story="1" data-tool="find_night_pediatric" data-source="live-key" data-key="required">
<text x="30" y="150" font-size="13" fill="#7DB3FF" data-max-w="60" letter-spacing="-0.1" font-weight="700"><tspan x="30" y="150">예시 1</tspan></text>
<rect x="100" y="120" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="374" y="120" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="648" y="120" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="922" y="120" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<text x="116" y="150" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="116" y="150">새벽에 아이가 열이 나요. 지금 문</tspan><tspan x="116" y="170">연 소아 진료가 있을까요?</tspan></text>
<text x="390" y="150" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="390" y="150">밤·휴일 소아 진료 찾기</tspan></text>
<text x="664" y="150" font-size="14" fill="#7DB3FF" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="664" y="150">공공기관에서 바로 확인 ·</tspan><tspan x="664" y="170">국립중앙의료원</tspan></text>
<text x="938" y="150" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="938" y="150">예시: 지금 진료 중으로 나온 곳의</tspan><tspan x="938" y="170">후보와 전화번호를 보여 줘요.</tspan><tspan x="938" y="190">가기 전에 전화로 꼭 확인하고,</tspan><tspan x="938" y="210">위급하면 119에 연락하세요.</tspan></text>
<rect x="390" y="162" width="66.7" height="16" rx="8" fill="#3A2A0A"/>
<text x="398" y="174" font-size="11" fill="#FFD27A" data-max-w="50.7" letter-spacing="-0.1" font-weight="700"><tspan x="398" y="174">신청 필요</tspan></text>
<line x1="352" y1="176" x2="370" y2="176" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="370,176 362,171 362,181" fill="#A9B4C0"/>
<line x1="626" y1="176" x2="644" y2="176" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="644,176 636,171 636,181" fill="#A9B4C0"/>
<line x1="900" y1="176" x2="918" y2="176" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="918,176 910,171 910,181" fill="#A9B4C0"/>
</g>
<g data-story="2" data-tool="get_timeline" data-source="builtin">
<text x="30" y="282" font-size="13" fill="#7DB3FF" data-max-w="60" letter-spacing="-0.1" font-weight="700"><tspan x="30" y="282">예시 2</tspan></text>
<rect x="100" y="252" width="248" height="132" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="374" y="252" width="248" height="132" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="648" y="252" width="248" height="132" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="922" y="252" width="248" height="132" rx="8" fill="#1A222C" stroke="#3A4654"/>
<text x="116" y="282" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="116" y="282">출산예정일이 2027-03-15예요.</tspan><tspan x="116" y="302">언제까지 뭘 해야 하나요?</tspan></text>
<text x="390" y="282" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="390" y="282">출산·육아 일정 계산</tspan></text>
<text x="664" y="282" font-size="14" fill="#7FD18E" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="664" y="282">미리 담아 둔 정보</tspan></text>
<text x="938" y="282" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="938" y="282">예시: 출생신고는</tspan><tspan x="938" y="302">2027-04-14까지, 부모급여</tspan><tspan x="938" y="322">신청은 2027-05-14까지예요.</tspan><tspan x="938" y="342">검진과 접종 일정도 날짜순으로</tspan><tspan x="938" y="362">정리해 줘요.</tspan></text>
<line x1="352" y1="318" x2="370" y2="318" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="370,318 362,313 362,323" fill="#A9B4C0"/>
<line x1="626" y1="318" x2="644" y2="318" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="644,318 636,313 636,323" fill="#A9B4C0"/>
<line x1="900" y1="318" x2="918" y2="318" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="918,318 910,313 910,323" fill="#A9B4C0"/>
</g>
<g data-story="3" data-tool="check_recall" data-source="live-key" data-key="required">
<text x="30" y="434" font-size="13" fill="#7DB3FF" data-max-w="60" letter-spacing="-0.1" font-weight="700"><tspan x="30" y="434">예시 3</tspan></text>
<rect x="100" y="404" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="374" y="404" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="648" y="404" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<rect x="922" y="404" width="248" height="112" rx="8" fill="#1A222C" stroke="#3A4654"/>
<text x="116" y="434" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="116" y="434">중고로 받은 아기 카시트, 리콜된</tspan><tspan x="116" y="454">적 있나요?</tspan></text>
<text x="390" y="434" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="390" y="434">아기 용품 리콜 확인</tspan></text>
<text x="664" y="434" font-size="14" fill="#7DB3FF" data-max-w="216" letter-spacing="-0.1" font-weight="700"><tspan x="664" y="434">공공기관에서 바로 확인 ·</tspan><tspan x="664" y="454">제품안전정보센터</tspan></text>
<text x="938" y="434" font-size="14" fill="#E8EDF2" data-max-w="216" letter-spacing="-0.1"><tspan x="938" y="434">예시: 같은 이름으로 공개된 리콜</tspan><tspan x="938" y="454">기록이 있으면 날짜와 사유를 보여</tspan><tspan x="938" y="474">줘요. 기록이 없다고 안전하다는</tspan><tspan x="938" y="494">뜻은 아니에요.</tspan></text>
<rect x="390" y="446" width="66.7" height="16" rx="8" fill="#3A2A0A"/>
<text x="398" y="458" font-size="11" fill="#FFD27A" data-max-w="50.7" letter-spacing="-0.1" font-weight="700"><tspan x="398" y="458">신청 필요</tspan></text>
<line x1="352" y1="460" x2="370" y2="460" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="370,460 362,455 362,465" fill="#A9B4C0"/>
<line x1="626" y1="460" x2="644" y2="460" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="644,460 636,455 636,465" fill="#A9B4C0"/>
<line x1="900" y1="460" x2="918" y2="460" stroke="#A9B4C0" stroke-width="2"/>
<polygon points="918,460 910,455 910,465" fill="#A9B4C0"/>
</g>
<text x="30" y="552" font-size="12" fill="#A9B4C0" data-max-w="1140" letter-spacing="-0.1"><tspan x="30" y="552">모두 예시예요. 실제 답은 그때 공개된 정보에 따라 달라지고, 건강 문제는 의료진과 상의하세요. 비공식 도구예요.</tspan></text>
</svg>
