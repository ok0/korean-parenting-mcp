name: mcpb-release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mcpb-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: pack
        env:
          KPM_BUILD_COMMIT: ${{ github.sha }}
        run: npm run pack:mcpb
      - name: smoke
        env:
          KPM_BUILD_COMMIT: ${{ github.sha }}
        run: npm run smoke:mcpb
      - name: publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mcpb-latest
          FILE: build-mcpb/korean-parenting-mcp.mcpb
        run: |
          version="$(node -p "require('./package.json').version")"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          title="korean-parenting-mcp 최신 자동 빌드"
          {
            echo "main 브랜치의 최신 상태로 자동으로 만든 시험판(Pre-release)입니다. 정식 버전 발표가 아닙니다."
            echo ""
            echo "- 커밋: $GITHUB_SHA"
            echo "- 버전: $version"
            echo "- 빌드 시각(UTC): $built_at"
            echo ""
            echo "정부·공공기관과 관계없는 비공식 개인 프로젝트입니다."
          } > "$RUNNER_TEMP/notes.md"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --prerelease --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "$FILE" --prerelease --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: verify anonymous download
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          attempts=12
          if [ "$REPO_PRIVATE" = "true" ]; then attempts=1; fi
          set +e
          node build-scripts/scripts/mcpb-release-check.js --commit "$GITHUB_SHA" --attempts "$attempts"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$REPO_PRIVATE" = "true" ]; then
            echo "::warning title=mcpb download check::저장소가 비공개라 로그인 없이 내려받을 수 없어 확인을 건너뜁니다. 저장소를 공개하면 이 확인이 실패할 때 워크플로가 실패합니다."
            exit 0
          fi
          exit "$code"
