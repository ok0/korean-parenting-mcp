name: revision-check
on:
  schedule:
    - cron: "17 0 * * 1" # 매주 월요일 09:17 KST
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: revision-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:scripts
      # 첨부 diff 기준 텍스트(저장소·패키지 밖, 7일 미접근 시 만료 → 비교 기준 없음)
      - name: restore annex baseline
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/annex-baseline
          key: annex-baseline-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            annex-baseline-v1-
      - name: check revisions
        id: check
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          mkdir -p "$RUNNER_TEMP/annex-baseline"
          set +e
          node build-scripts/scripts/check-revisions.js --out "$RUNNER_TEMP/issue.md" --baseline-dir "$RUNNER_TEMP/annex-baseline" 2> "$RUNNER_TEMP/check.log"
          code=$?
          set -e
          cat "$RUNNER_TEMP/check.log" >&2
          { echo "### 근거 문서 개정 확인"; echo '```'; cat "$RUNNER_TEMP/check.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then exit "$code"; fi
      - name: save annex baseline
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '10'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/annex-baseline
          key: annex-baseline-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: open or update issue
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create revision-check --color B60205 --description "근거 문서 개정 감지" --force
          number="$(gh issue list --label revision-check --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "근거 문서 개정 감지" --label revision-check --body-file "$RUNNER_TEMP/issue.md"
          fi
