<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="749" viewBox="0 0 1200 749" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">육아 도우미 한 장 지도 (도구 10개)</title>
<desc id="desc">부모의 질문을 AI 도우미가 받아 도구 10개 중 알맞은 것을 고르고, 도구는 미리 담아 둔 정보나 공공기관 자료로 답합니다. 도구: get_timeline, get_leave_article, find_night_pediatric, find_benefits, check_pregnancy_drug, check_recall, find_daycare, find_vaccination_clinic, find_checkup_clinic, find_kindergarten</desc>
<rect x="0" y="0" width="1200" height="749" fill="#0F141A"/>
<text x="30" y="44" font-size="22" fill="#E8EDF2" data-max-w="1140" letter-spacing="-0.4" font-weight="700"><tspan x="30" y="44">질문 하나가 답이 되기까지 · 도구 10개</tspan></text>
<text x="30" y="70" font-size="13" fill="#A9B4C0" data-max-w="1140" letter-spacing="-0.1"><tspan x="30" y="70">부모가 평소 말로 물으면, AI 도우미가 알맞은 도구를 골라 정보를 찾아 답해요.</tspan></text>
